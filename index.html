<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジムコスト診断</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    .sub {
      margin-top: 10px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>ジムコスト診断</h1>

    <input id="fee" type="number" placeholder="月額料金（例: 8000）">
    <input id="visits" type="number" placeholder="月のジム回数（例: 4）">

    <button onclick="calc()">診断する</button>

    <div class="result" id="result"></div>
    <div class="sub" id="comment"></div>
  </div>

  <script>
    function calc() {
      const fee = Number(document.getElementById("fee").value);
      const visits = Number(document.getElementById("visits").value);

      if (!fee || !visits) {
        alert("数値を入力してください");
        return;
      }

      const per = fee / visits;

      document.getElementById("result").innerText =
        `1回あたり ${Math.round(per).toLocaleString()} 円`;

      let comment = "";

      if (per >= 8000) {
        comment = "パーソナル級（かなり贅沢なジム利用）";
      } else if (per >= 2000) {
        comment = "ダンベル級（ちゃんと通えている）";
      } else if (per >= 500) {
        comment = "牛丼級（コスパ優秀トレーニー）";
      } else {
        comment = "異常コスパ（ほぼ無限回収モード）";
      }

      document.getElementById("comment").innerText = comment;
    }
  </script>

</body>
</html>
