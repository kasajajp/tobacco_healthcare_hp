<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジムコスト診断</title>

  <style>
    body {
      font-family: sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #1c1c1c;
      padding: 26px;
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .muscle {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    .calc {
      background: #fff;
      color: #000;
    }

    .xpost {
      background: #000;
      color: #fff;
      border: 2px solid #444;
      font-size: 18px;
      padding: 18px;
    }

    .result {
      margin-top: 18px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    .comment, .badge, .counter {
      margin-top: 10px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .box {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 12px;
      text-align: center;
    }

    .box a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .xbox {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 12px;
      text-align: center;
    }

    .xbox a {
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">

  <img class="muscle"
       src="https://images.unsplash.com/photo-1571019613914-85f342c3a0b0"
       alt="muscle">

  <h1>ジムコスト診断</h1>

  <div class="counter" id="counter"></div>

  <input id="fee" type="number" placeholder="月額料金（例：8000）">
  <input id="visits" type="number" placeholder="月のジム回数（例：4）">

  <button class="calc" onclick="calc()">診断する</button>

  <div class="result" id="result"></div>
  <div class="comment" id="comment"></div>
  <div class="badge" id="badge"></div>

  <button class="xpost" onclick="postToX()">Xでバズ投稿する 🚀</button>

  <!-- X投稿表示枠 -->
  <div class="xbox" id="xbox"></div>

  <!-- 下部リンク枠（追加要件） -->
  <div class="box">
    あなたのジムの料金は？<br><br>
    <a href="https://kasajajp/kasaja_gymmap" target="_blank">
      https://kasajajp/kasaja_gymmap
    </a>
  </div>

  <div style="margin-top: 16px; font-size: 12px; text-align:center; color:#666;">
    <a href="https://kasajajp.github.io/" style="color:#666;text-decoration:none;">
      KASAJA
    </a>
  </div>

</div>

<script>
let lastText = "";
let lastCounter = 0;

function calc() {
  const fee = Number(document.getElementById("fee").value);
  const visits = Number(document.getElementById("visits").value);

  if (!fee || !visits) return;

  const per = fee / visits;

  let label = "";
  let badge = "";

  if (per >= 10000) {
    label = "富豪パーソナル級";
    badge = "完全にパーソナル超え";
  } else if (per >= 8000) {
    label = "パーソナル級";
    badge = "かなり贅沢";
  } else if (per >= 4000) {
    label = "高級会員級";
    badge = "意識高い系";
  } else if (per >= 2000) {
    label = "ダンベル級";
    badge = "標準トレーニー";
  } else if (per >= 1000) {
    label = "公園トレ級";
    badge = "コスパ良好";
  } else if (per >= 500) {
    label = "牛丼級";
    badge = "かなりコスパ良い";
  } else {
    label = "異常コスパ級";
    badge = "無限回収モード";
  }

  lastText = `ジム1回 ${Math.round(per)}円 → ${label}`;

  document.getElementById("result").innerText = lastText;
  document.getElementById("comment").innerText = "X投稿で共有可能";
  document.getElementById("badge").innerText = badge;

  // 診断人数カウント（ローカル保存）
  let count = localStorage.getItem("gym_count");
  count = count ? Number(count) + 1 : 1;
  localStorage.setItem("gym_count", count);

  lastCounter = count;
  document.getElementById("counter").innerText =
    `あなたは ${count} 人目の診断者です`;
}

function postToX() {
  if (!lastText) {
    alert("先に診断してください");
    return;
  }

  const hashtags = [
    "#ジムコスト診断",
    "#筋トレ",
    "#フィットネス",
    "#ジム通い"
  ].join(" ");

  const text =
`【ジムコスト診断｜KASAJA】
${lastText}

${hashtags}

診断はこちら👇
https://kasajajp.github.io/tobacco_healthcare_hp/`;

  const url =
    `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;

  window.open(url, "_blank");

  // 下にXプレビュー表示
  document.getElementById("xbox").innerHTML =
    "投稿内容をXで確認できます（別タブで開きました）";
}
</script>

</body>
</html>
