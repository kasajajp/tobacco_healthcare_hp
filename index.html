<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジムコスト診断 + X投稿</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .calc-btn {
      background: white;
      color: black;
    }

    .x-btn {
      background: #000;
      color: white;
      border: 1px solid #444;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
    }

    .comment {
      margin-top: 10px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>ジムコスト診断</h1>

  <input id="fee" type="number" placeholder="月額料金（例：8000）">
  <input id="visits" type="number" placeholder="月の回数（例：4）">

  <button class="calc-btn" onclick="calc()">計算する</button>

  <div class="result" id="result"></div>
  <div class="comment" id="comment"></div>

  <button class="x-btn" onclick="postToX()">Xで投稿する</button>
</div>

<script>
let lastText = "";

function calc() {
  const fee = Number(document.getElementById("fee").value);
  const visits = Number(document.getElementById("visits").value);

  if (!fee || !visits) return;

  const per = fee / visits;

  let label = "";

  if (per >= 8000) {
    label = "パーソナル級";
  } else if (per >= 2000) {
    label = "ダンベル級";
  } else if (per >= 500) {
    label = "牛丼級";
  } else {
    label = "異常コスパ";
  }

  lastText = `ジム1回あたり${Math.round(per)}円 → ${label}`;

  document.getElementById("result").innerText = lastText;
  document.getElementById("comment").innerText = "この結果をXに投稿できます";
}

function postToX() {
  if (!lastText) {
    alert("先に計算してください");
    return;
  }

  const text = encodeURIComponent(lastText + " #ジムコスト診断");

  const url = `https://twitter.com/intent/tweet?text=${text}`;

  window.open(url, "_blank");
}
</script>

</body>
</html>
