<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エニタイム葛西店</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    .label {
      color: #aaa;
      font-size: 14px;
      margin-top: 16px;
    }

    .value {
      font-size: 18px;
      margin-top: 4px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>エニタイムフィットネス葛西店</h1>

    <div class="label">月額料金</div>
    <div class="price">¥8,200（税込）</div>

    <div class="label">住所</div>
    <div class="value">
      〒134-0084<br>
      東京都江戸川区東葛西6-2-1 3F
    </div>
  </div>

</body>
</html>
